<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8a4b1c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Almanac"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Valley Almanac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A pocket companion for Stardew Valley that follows your in-game date.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a wooden menu over the valley sky. Sticky plank header with the in-game date and search,
   parchment panels framed in wood, and a hotbar of square slots for the sections. */
:root {
  --sky-top: #a7d6e6; --sky-bot: #dcefd9;
  --paper: #fce6b4; --paper-2: #f4cf8d; --paper-line: #dfae63;
  --wood: #8a4b1c; --wood-hi: #d48a3b; --wood-dk: #4b240b; --plank-ink: #fff1d2;
  --ink: #3b200c; --ink-2: #74512d;
  --sp: #3d8622; --su: #a87200; --fa: #b0480f; --wi: #2b6ca6;
  --love: #c42d60; --good: #357a26; --bad: #ad3427; --warn: #a65f00; --slot-sel: #d33b2c;
  --on-acc: #fffaf0; --focus: #1d5d98; --veil: rgba(40, 20, 5, .42);
  --f-display: 'Pixelify Sans', 'Courier New', ui-monospace, monospace;
  --f-body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --acc: var(--sp);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-top: #0c1326; --sky-bot: #1c2240;
  --paper: #2a2337; --paper-2: #362c46; --paper-line: #4d3f60;
  --wood: #6e3d1b; --wood-hi: #b97a3a; --wood-dk: #07060d; --plank-ink: #fbe9c6;
  --ink: #f4e5c6; --ink-2: #bba98a;
  --sp: #86cc63; --su: #f0c44d; --fa: #f0915a; --wi: #88bff0;
  --love: #ff86ad; --good: #8fd27d; --bad: #ff9283; --warn: #ffbb55; --slot-sel: #ff6a55;
  --on-acc: #1b1526; --focus: #a6d4ff; --veil: rgba(3, 2, 8, .6);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sky-top: #0c1326; --sky-bot: #1c2240;
  --paper: #2a2337; --paper-2: #362c46; --paper-line: #4d3f60;
  --wood: #6e3d1b; --wood-hi: #b97a3a; --wood-dk: #07060d; --plank-ink: #fbe9c6;
  --ink: #f4e5c6; --ink-2: #bba98a;
  --sp: #86cc63; --su: #f0c44d; --fa: #f0915a; --wi: #88bff0;
  --love: #ff86ad; --good: #8fd27d; --bad: #ff9283; --warn: #ffbb55; --slot-sel: #ff6a55;
  --on-acc: #1b1526; --focus: #a6d4ff; --veil: rgba(3, 2, 8, .6);
  color-scheme: dark;
}
body[data-season="Summer"] { --acc: var(--su); }
body[data-season="Fall"] { --acc: var(--fa); }
body[data-season="Winter"] { --acc: var(--wi); }

* { box-sizing: border-box; }
html { background: var(--sky-bot); }
body {
  margin: 0; min-height: 100vh; font: 16px/1.5 var(--f-body); color: var(--ink);
  background-color: var(--sky-bot);
  background-image: linear-gradient(180deg, var(--sky-top) 0, var(--sky-bot) 520px);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body.sheet-open { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; display: flex; gap: 8px; align-items: center; } h4 { font-size: 1rem; margin: 16px 0 8px; }
p { margin: 8px 0; }
.pix { display: inline-block; vertical-align: -2px; flex: none; }
.muted { color: var(--ink-2); } .small { font-size: .875rem; } .big { font-size: 1.1rem; }
.good { color: var(--good); } .bad { color: var(--bad); }
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; color: var(--ink-2); }

/* ---------- Header plank ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background-color: var(--wood);
  background-image: repeating-linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.09) 9px 10px), linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.12));
  border-bottom: 4px solid var(--wood-dk); box-shadow: inset 0 -2px 0 var(--wood-hi);
  color: var(--plank-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 10px;
}
.top-in { max-width: 1100px; margin: 0 auto; display: grid; gap: 8px; }
.row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; margin-right: auto; display: flex; align-items: center; gap: 8px; color: var(--plank-ink); text-shadow: 0 2px 0 var(--wood-dk); }
.brand .pix { color: var(--acc); filter: drop-shadow(0 2px 0 var(--wood-dk)); }
.datebar { display: flex; align-items: stretch; gap: 4px; }
.pbtn {
  background: var(--paper); color: var(--ink); border: 2px solid var(--wood-dk); border-radius: 4px;
  box-shadow: inset 0 -3px 0 var(--paper-2); padding: 4px 10px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px;
}
.pbtn:active { box-shadow: inset 0 2px 0 var(--paper-2); }
.arrow { font-family: var(--f-display); font-size: 1.3rem; padding: 0 10px; }
#dateBtn { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; line-height: 1.1; min-width: 118px; }
#dMain { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--acc); }
#dSub { font-size: .75rem; color: var(--ink-2); font-weight: 700; }
#wxBtn[aria-pressed="true"] { color: var(--wi); }
#wxBtn .pix { color: var(--su); } #wxBtn[aria-pressed="true"] .pix { color: var(--wi); }
#hourSel { appearance: none; -webkit-appearance: none; color: var(--ink); background: var(--paper); border: 2px solid var(--wood-dk); border-radius: 4px; box-shadow: inset 0 -3px 0 var(--paper-2); min-height: 40px; padding: 4px 26px 4px 10px; font-weight: 700; font-size: .9rem;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.searchwrap { position: relative; }
.searchwrap .pix { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
#q {
  width: 100%; min-height: 46px; padding: 10px 44px 10px 40px; font-size: 1rem; font-weight: 600;
  background: var(--paper); color: var(--ink); border: 3px solid var(--wood-dk); border-radius: 4px; box-shadow: inset 0 3px 0 var(--paper-2);
}
#q::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
#q:placeholder-shown ~ .clearq { display: none; }
#q::placeholder { color: var(--ink-2); font-weight: 600; }
#q:focus { outline: 3px solid var(--acc); outline-offset: 1px; }
.clearq { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: transparent; border: 0; padding: 8px; color: var(--ink-2); }

/* ---------- Hotbar ---------- */
.hotbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  background-color: var(--wood); border-top: 4px solid var(--wood-dk); box-shadow: inset 0 2px 0 var(--wood-hi);
}
.slots { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tabbtn {
  aspect-ratio: auto; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: var(--paper-2); color: var(--ink); border: 2px solid var(--wood-dk); border-radius: 3px; box-shadow: inset 0 0 0 2px var(--paper-line);
  font-size: .72rem; font-weight: 800; letter-spacing: .02em; padding: 4px 2px;
}
.tabbtn .pix { color: var(--ink-2); }
.tabbtn[aria-current="page"] { background: var(--paper); box-shadow: inset 0 0 0 3px var(--slot-sel); }
.tabbtn[aria-current="page"] .pix { color: var(--acc); }

/* ---------- Main ---------- */
main, #results {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 16px; align-content: start;
}
.panel {
  background: var(--paper); border: 3px solid var(--wood); border-radius: 5px;
  box-shadow: inset 0 0 0 2px var(--wood-hi), 0 4px 0 var(--wood-dk);
  padding: 14px 16px 16px; min-width: 0;
}
.panel > h3 { margin-bottom: 8px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.room-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.today { border-color: var(--wood); background-image: linear-gradient(90deg, var(--acc) 0 6px, transparent 6px); padding-left: 22px; }
.today-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.today-head h2 { font-size: 1.75rem; color: var(--acc); }
.today-head h2 .sub { display: block; font-family: var(--f-body); font-size: .95rem; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.today-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.today-list li { padding: 8px 10px; border-radius: 4px; background: var(--paper-2); line-height: 1.45; }
.today-list li.hl.bday { background: color-mix(in srgb, var(--love) 14%, var(--paper)); }
.today-list li.hl.fest { background: color-mix(in srgb, var(--acc) 18%, var(--paper)); }
.today-list li.hl.warn { background: color-mix(in srgb, var(--warn) 18%, var(--paper)); }
.today-list .chips { display: inline-flex; margin-left: 4px; vertical-align: middle; }
.firstrun { margin-top: 12px; padding: 12px; border: 2px dashed var(--acc); border-radius: 4px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.firstrun p { margin: 0; flex: 1 1 240px; }

.uplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.uplist li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--paper-line); }
.uplist li:last-child { border-bottom: 0; }
.when { flex: none; width: 84px; font-weight: 800; font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.plantlist, .flist, .shoplist { list-style: none; margin: 0; padding: 0; }
.plantlist li, .flist li, .shoplist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 0; border-bottom: 1px dashed var(--paper-line); }
.plantlist li:last-child, .flist li:last-child, .shoplist li:last-child { border-bottom: 0; }
.plantlist .meta { color: var(--ink-2); font-size: .875rem; }
.plantlist .pill { margin-left: auto; }
.flist .meta { color: var(--ink-2); font-size: .875rem; flex: 1 1 200px; }
.flist .src { font-size: .8rem; color: var(--ink-2); flex-basis: 100%; }
.shoplist li { justify-content: space-between; }
.locrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 6px 0; border-bottom: 1px dashed var(--paper-line); }
.locrow:last-child { border-bottom: 0; }
.loc { font-weight: 800; font-size: .85rem; color: var(--ink-2); }

/* chips & pills */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 3px 10px; border-radius: 4px;
  background: var(--paper-2); border: 2px solid var(--paper-line); color: var(--ink); font-weight: 700; font-size: .9rem; line-height: 1.2; text-align: left;
}
button.chip:hover { border-color: var(--wood-hi); }
.chip.plain { font-weight: 600; font-style: italic; }
.chip.now::after { content: ''; width: 7px; height: 7px; border-radius: 1px; background: var(--acc); margin-left: 2px; }
.chip.love { border-color: color-mix(in srgb, var(--love) 55%, var(--paper-line)); }
.chip.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--paper-line)); }
.chip.link { background: none; border: 0; padding: 0; min-height: 0; font-size: inherit; color: inherit; text-decoration: underline; text-decoration-style: dotted; text-decoration-color: var(--acc); text-underline-offset: 3px; text-decoration-thickness: 2px; font-weight: 800; }
.chip.link.now::after { display: none; }
.pill { display: inline-block; font-size: .75rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--good) 18%, var(--paper)); color: var(--good); white-space: nowrap; }
.pill.soft { background: var(--paper-2); color: var(--ink-2); }
.pill.warn { background: color-mix(in srgb, var(--warn) 20%, var(--paper)); color: var(--warn); }
.pill.hot { background: var(--love); color: var(--on-acc); }
.stag { display: inline-block; font-size: .72rem; font-weight: 800; padding: 1px 7px; border-radius: 3px; margin-right: 4px; color: var(--on-acc); }
.stag.c-spring { background: var(--sp); } .stag.c-summer { background: var(--su); } .stag.c-fall { background: var(--fa); } .stag.c-winter { background: var(--wi); }
.stag.any { background: var(--paper-2); color: var(--ink-2); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 1px; margin-left: 4px; vertical-align: 0; }
.dot.c-spring { background: var(--sp); } .dot.c-summer { background: var(--su); } .dot.c-fall { background: var(--fa); } .dot.c-winter { background: var(--wi); }

.btn { background: var(--acc); color: var(--on-acc); border: 2px solid var(--wood-dk); border-radius: 4px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); padding: 8px 14px; font-weight: 800; min-height: 40px; }
.btn.small { padding: 4px 12px; min-height: 34px; font-size: .9rem; }
.btn.ghost { background: var(--paper-2); color: var(--ink); }
.btn.danger { background: var(--bad); color: var(--on-acc); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); text-align: center; padding-bottom: 2px; }
.cal-d { min-height: 58px; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 3px; text-align: left; background: var(--paper-2); border: 2px solid transparent; border-radius: 3px; overflow: hidden; }
.cal-d .n { font-family: var(--f-display); font-weight: 700; font-size: .95rem; line-height: 1; font-variant-numeric: tabular-nums; }
.cal-d.sel { background: var(--paper); border-color: var(--slot-sel); }
.cal-d .m { font-size: .62rem; font-weight: 800; line-height: 1.15; border-radius: 2px; padding: 1px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-d .m.fest { background: var(--acc); color: var(--on-acc); }
.cal-d .m.bday { background: color-mix(in srgb, var(--love) 22%, var(--paper)); color: var(--ink); }
.cal-d .m.ev { background: color-mix(in srgb, var(--ink-2) 18%, var(--paper)); color: var(--ink); }
@media (max-width: 480px) { .cal-d { min-height: 50px; } .cal-d .m { font-size: 0; height: 6px; padding: 0; } }

/* bundles */
.bar { height: 10px; background: var(--paper-2); border: 2px solid var(--wood-dk); border-radius: 2px; overflow: hidden; margin: 6px 0 4px; }
.bar span { display: block; height: 100%; background: var(--acc); }
.bar.big { height: 14px; margin: 10px 0; }
.bundles { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 8px; }
@media (min-width: 760px) { .bundles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.bundle { background: var(--paper-2); border-radius: 4px; padding: 10px 12px; min-width: 0; }
.bundle.done { opacity: .78; }
.bundle-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.bundle-h h4 { margin: 0; }
.count { font-weight: 800; font-size: .85rem; font-variant-numeric: tabular-nums; }
.reward { font-size: .8rem; color: var(--ink-2); margin: 6px 0 0; }
.items { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.it { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--paper-line); }
.it:last-child { border-bottom: 0; }
.it.got .it-name { text-decoration: line-through; text-decoration-color: var(--ink-2); opacity: .7; }
.it-main { min-width: 0; flex: 1; }
.it-name { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.it-how { font-size: .8rem; color: var(--ink-2); line-height: 1.35; }
.qty, .qual { font-size: .78rem; font-weight: 800; color: var(--ink-2); }
.qual { color: var(--su); }
.bname { font-weight: 800; color: var(--ink-2); font-size: .85rem; }
.check { position: relative; flex: none; width: 28px; height: 28px; margin-top: -2px; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check .box { position: absolute; inset: 0; border: 3px solid var(--wood); border-radius: 3px; background: var(--paper); box-shadow: inset 0 2px 0 var(--paper-2); pointer-events: none; }
.check input:checked + .box { background: var(--acc); border-color: var(--wood-dk); }
.check input:checked + .box::after { content: ''; position: absolute; left: 7px; top: 2px; width: 7px; height: 13px; border: solid var(--on-acc); border-width: 0 4px 4px 0; transform: rotate(45deg); }
.check input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }
.toggle { display: flex; gap: 10px; align-items: center; font-weight: 700; margin: 8px 0; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--acc); flex: none; }

/* segmented */
.segs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.seg { background: var(--paper-2); border: 2px solid var(--paper-line); border-radius: 4px; padding: 5px 12px; font-weight: 800; font-size: .9rem; min-height: 36px; }
.seg.on { background: var(--acc); color: var(--on-acc); border-color: var(--wood-dk); }
.segs.seasons .seg.on.c-spring { background: var(--sp); } .segs.seasons .seg.on.c-summer { background: var(--su); } .segs.seasons .seg.on.c-fall { background: var(--fa); } .segs.seasons .seg.on.c-winter { background: var(--wi); }

/* people */
.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .people { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .people { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.person { width: 100%; text-align: left; display: grid; gap: 2px; padding: 10px 12px; background: var(--paper-2); border: 2px solid transparent; border-radius: 4px; }
.person:hover { border-color: var(--wood-hi); }
.pname { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }
.heart { color: var(--love); display: inline-flex; }
.pbday { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ploves { font-size: .82rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tables */
.tablewrap { overflow-x: auto; margin: 4px -4px 0; padding: 0 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); padding: 6px 8px; border-bottom: 2px solid var(--paper-line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px dashed var(--paper-line); vertical-align: top; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sub-h { margin: 18px 0 6px; }

/* guides */
.guides { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 680px) { .guides { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.guide { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 12px; background: var(--paper-2); border: 2px solid transparent; border-radius: 4px; font-weight: 800; }
.guide:hover { border-color: var(--wood-hi); }
.steps { margin: 8px 0; padding-left: 22px; display: grid; gap: 6px; }

/* Valley Almanac — data model: index, gift tastes, calendar, search. No DOM in here. */

const SEASON_CODE = { Sp: 'Spring', Su: 'Summer', Fa: 'Fall', Wi: 'Winter' };
const SEASON_IDX = { Spring: 0, Summer: 1, Fall: 2, Winter: 3 };

function parseSeasons(code) {
  if (!code || code === 'Any' || code === 'All') return null; // null = any season
  return code.split(' ').filter(c => SEASON_CODE[c]).map(c => SEASON_CODE[c]);
}
function slug(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
function fmtHour(h) {
  const x = ((h % 24) + 24) % 24;
  if (x === 0) return 'midnight';
  if (x === 12) return 'noon';
  return (x % 12 || 12) + (x < 12 ? 'am' : 'pm');
}
function fmtTimes(times) {
  if (times.length === 1 && times[0][0] <= 6 && times[0][1] >= 26) return 'Any time';
  return times.map(([a, b]) => fmtHour(a) + '–' + fmtHour(b)).join(', ');
}
function gold(n) { return n ? n.toLocaleString('en-US') + 'g' : ''; }

  if (el) el.textContent = cloud.ok ? 'Your date and bundle checks are saved to your Claude account, so they follow you between devices.' : 'Your date and bundle checks are saved in this browser.';
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const seasonCls = s => 'c-' + s.toLowerCase();
function ccDone() { return state.ccDone || BUNDLE_ROOMS.every(r => r.bundles.every(bundleDone)); }
function ctx() { return { season: state.season, day: state.day, year: state.year, rain: state.rain, hour: state.hour, ccDone: ccDone() }; }
function showSpoil(e) { return state.spoilers || !e || !e.spoil; }
function idFor(name) {
  const it = itemByName(name); if (it) return it.id;
  const v = IDX.get('villager:' + slug(name)) || IDX.get('person:' + slug(name)); return v ? v.id : null;
}
function chip(name, opts = {}) {
  const id = opts.id || idFor(name);
  const e = id && IDX.get(id);
  if (e && !showSpoil(e)) return '';
  const now = opts.mark && e && e.seasons && e.seasons.includes(state.season);
  const cls = 'chip' + (opts.cls ? ' ' + opts.cls : '') + (now ? ' now' : '');
  const label = esc(opts.label || name);
  return id ? `<button class="${cls}" data-open="${esc(id)}"${now ? ' title="In season now"' : ''}>${label}</button>` : `<span class="${cls} plain">${label}</span>`;
}
function seasonTags(seasons) {
  if (!seasons) return '<span class="stag any">Any season</span>';
  return seasons.map(s => `<span class="stag ${seasonCls(s)}">${s}</span>`).join('');
}
function dateLabel(s, d) { return `${s} ${d}`; }
function relDays(n) { return n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`; }
function bundleCount(b) { return b.items.filter(i => state.checks[i.key]).length; }
function bundleDone(b) { return bundleCount(b) >= b.need; }

/* ---------- Pixel icons ---------- */
const PIX = {
  heart: ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'],
  sun: ['....X....', '.X.....X.', '...XXX...', '..XXXXX..', 'X.XXXXX.X', '..XXXXX..', '...XXX...', '.X.....X.', '....X....'],
  rain: ['...XXX...', '.XXXXXXX.', 'XXXXXXXXX', '.XXXXXXX.', '.........', '.X..X..X.', 'X..X..X..', '.........'],
  sprout: ['.XX...XX.', 'XXXX.XXXX', '.XXX.XXX.', '....X....', '....X....', '....X....', '..XXXXX..', '.XXXXXXX.'],
  star: ['...X...', '..XXX..', 'XXXXXXX', '.XXXXX.', '..XXX..', '.XX.XX.', '.X...X.'],
  book: ['.XXX.XXX.', 'X...X...X', 'X.X.X.X.X', 'X...X...X', 'X.X.X.X.X', 'X...X...X', '.XXX.XXX.'],
  search: ['.XXX....', 'X...X...', 'X...X...', 'X...X...', '.XXX....', '....XX..', '.....XX.', '......XX'],
  fish: ['.XXXX...X', 'XXXXXX.XX', 'X.XXXXXX.', 'XXXXXX.XX', '.XXXX...X'],
  gift: ['.XX.XX.', 'XXXXXXX', '...X...', 'XXXXXXX', 'X..X..X', 'X..X..X', 'XXXXXXX'],
  close: ['X.....X', '.X...X.', '..X.X..', '...X...', '..X.X..', '.X...X.', 'X.....X'],
  back: ['...X...', '..X....', '.X.....', 'XXXXXXX', '.X.....', '..X....', '...X...'],
  cal: ['.X...X.', 'XXXXXXX', 'X.....X', 'X.X.X.X', 'X.....X', 'X.X.X.X', 'XXXXXXX'],
};
function pix(name, size = 16) {
  const rows = PIX[name]; const w = rows[0].length, h = rows.length;
  let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'X') r += `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`; }));
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" width="${size}" height="${Math.round(size * h / w)}" aria-hidden="true" fill="currentColor" shape-rendering="crispEdges">${r}</svg>`;
}

/* ---------- Header / date ---------- */
function renderHeader() {
  document.body.dataset.season = state.season;
  $('#dMain').textContent = dateLabel(state.season, state.day);
  $('#dSub').textContent = `${WEEKDAYS[dow(state.day)]} · Year ${state.year}`;
  $('#wxBtn').innerHTML = state.rain ? pix('rain', 18) + '<span>Rain</span>' : pix('sun', 18) + '<span>Sunny</span>';
  $('#wxBtn').setAttribute('aria-pressed', state.rain ? 'true' : 'false');
  $('#hourSel').value = state.hour == null ? '' : String(state.hour);
  document.querySelectorAll('.tabbtn').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
}
function shiftDay(n) {
  const a = absDay(state.season, state.day, state.year) + n;
  Object.assign(state, fromAbs(a)); state.dateSet = 1;
  save(); render();
}

/* ---------- Today ---------- */
function todayView() {
  const st = ctx();
  const evs = eventsOn(st.season, st.day, st.year).filter(e => !e.spoil || state.spoilers);
  const d = dow(st.day);
  const items = [];
  for (const ev of evs) {
    if (ev.kind === 'festival') {
      const f = ev.e.f;
      items.push(`<li class="hl fest"><b>${chip(f.n, { id: ev.e.id, cls: 'link' })}</b> today, ${esc(f.where)}, ${esc(f.time)}. ${esc(f.tip)}</li>`);
    } else if (ev.kind === 'birthday') {
      const v = ev.e.v; const lv = lovedItems(v);
      items.push(`<li class="hl bday">${pix('gift', 14)} It's <b>${chip(v.n, { id: ev.e.id, cls: 'link' })}'s birthday</b>. A gift today counts 8×. Loves: <span class="chips">${lv.names.slice(0, 6).map(n => chip(n, { mark: 1 })).join('')}</span></li>`);
    } else items.push(`<li><b>${esc(ev.name)}.</b> ${esc(ev.what)}</li>`);
  }
  const qs = queenOfSauce(st.season, st.day, st.year);
  if (qs && qs.recipe) items.push(`<li>Sunday TV: the Queen of Sauce teaches ${chip(qs.recipe, { cls: 'link' })}. Watch it on your TV to learn it.</li>`);
  else if (qs && qs.rerun) items.push(`<li>Sunday TV: the Queen of Sauce shows a recipe. Watch it to learn it.</li>`);
  if (d === 3) items.push(`<li>Wednesday TV: the Queen of Sauce reruns an older recipe you may have missed.</li>`);
  if (d === 5 || d === 0) items.push(`<li>The ${chip('Traveling Cart', { id: 'shop:traveling-cart', cls: 'link' })} is in Cindersap Forest, 6am–8pm. Check it for bundle items you are missing.</li>`);
  if (st.rain) items.push(`<li>Rain waters your crops for you. Different fish are biting, and Willy's shop is open even if it's Saturday.</li>`);
  const left = 28 - st.day;
  if (left <= 6) items.push(`<li class="hl warn"><b>${left === 0 ? 'Last day of ' + st.season + '.' : left + ' day' + (left > 1 ? 's' : '') + ' left in ' + st.season + '.'}</b> Crops that don't grow next season die overnight on the 1st. Harvest what you can.</li>`);
  const closed = SHOPS.filter(s => showSpoil({ spoil: s.spoil })).map(s => ({ s, r: shopStatus(s, Object.assign({}, st, { hour: null })) })).filter(x => x.r.closed && !/Summer only|Fridays & Sundays|Closed for good/.test(x.r.why));
  if (closed.length) items.push(`<li>Closed today: ${closed.map(x => chip(x.s.n, { id: 'shop:' + slug(x.s.n), cls: 'link' })).join(', ')}.</li>`);

  // coming up
  const up = [];
  for (let k = 1; k <= 7; k++) {
    const t = fromAbs(absDay(st.season, st.day, st.year) + k);
    for (const ev of eventsOn(t.season, t.day, t.year)) if (!ev.spoil || state.spoilers) up.push({ k, t, ev });
  }
  const upHtml = up.length ? up.map(({ k, t, ev }) => `<li><span class="when">${k === 1 ? 'Tomorrow' : WEEKDAYS[dow(t.day)] + ' ' + t.day}</span><span>${ev.kind === 'birthday' ? pix('gift', 12) + ' ' + chip(ev.name, { id: ev.e.id, cls: 'link' }) + "'s birthday" : ev.kind === 'festival' ? pix('star', 12) + ' ' + chip(ev.name, { id: ev.e.id, cls: 'link' }) : esc(ev.name)}</span></li>`).join('') : '<li class="muted">Nothing special this week.</li>';

  // needed seasonal bundle items
  const need = [];
  for (const room of BUNDLE_ROOMS) for (const b of room.bundles) {
    if (bundleDone(b)) continue;
    for (const it of b.items) {
      if (state.checks[it.key]) continue;
      const e = itemByName(it.name);
      if (e && e.seasons && e.seasons.length < 4 && e.seasons.includes(st.season) && !need.find(n => n.name === it.name)) need.push(it);
    }
  }
  const needHtml = need.length ? `<div class="chips">${need.map(it => chip(it.name)).join('')}</div>` : `<p class="muted">Nothing seasonal left to collect for bundles this ${st.season}.</p>`;

  const plant = plantable(st).filter(p => p.e.crop.seasons.length < 4);
  const ok = plant.filter(p => p.ok).sort((a, b) => (a.lastDay || 0) - (b.lastDay || 0));
  const late = plant.filter(p => !p.ok);
  const plantHtml = ok.map(p => `<li>${chip(p.e.name, { id: p.e.id, cls: 'link' })}<span class="meta">${p.e.crop.days} days${p.e.crop.regrow ? ', then every ' + p.e.crop.regrow : ''}${/^Pierre's$/.test(p.e.crop.where) ? '' : ' · ' + esc(p.e.crop.where.split(',')[0])}</span><span class="pill ${p.lastDay - st.day <= 2 ? 'warn' : ''}">${p.lastDay >= 28 ? 'plant any day' : p.lastDay === st.day ? 'last day to plant' : 'plant by ' + p.lastDay}</span></li>`).join('')
    + (late.length ? `<li class="muted small">Too late this season: ${late.map(p => esc(p.e.name)).join(', ')}.</li>` : '');

  const fish = fishNow(st).filter(showSpoil).filter(e => !e.fish.legendary);
  const byLoc = {};
  const LOCS = [['Ocean', /Ocean/], ['Rivers (town & forest)', /River/], ['Mountain Lake', /Mountain Lake/], ['Forest Pond', /Forest Pond/], ['Forest Waterfalls', /Waterfalls/], ['Secret Woods', /Secret Woods/], ['Sewers', /Sewers/], ['The Mines', /Mines/], ['The Desert', /Desert/], ['Night Market', /Night Market/]];
  for (const e of fish) { let hit = false; for (const [loc, re] of LOCS) if (re.test(e.fish.where)) { (byLoc[loc] = byLoc[loc] || []).push(e); hit = true; } if (!hit) (byLoc.Elsewhere = byLoc.Elsewhere || []).push(e); }
  const fishHtml = Object.entries(byLoc).map(([loc, list]) => `<div class="locrow"><span class="loc">${esc(loc)}</span><span class="chips">${list.map(e => chip(e.name, { id: e.id, label: e.name + (e.fish.weather === 'Rain' ? ' ☂' : '') })).join('')}</span></div>`).join('');

  const forage = FORAGE.filter(f => { const s = parseSeasons(f[1]); return s && s.includes(st.season); }).map(f => chip(f[0])).join('');

  return `
  <section class="panel today">
    <div class="today-head">
      <div><div class="eyebrow">Today on the farm</div><h2>${esc(dateLabel(st.season, st.day))} <span class="sub">${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d]}, Year ${st.year}</span></h2></div>
      <button class="btn small" data-action="nextday">Next day ›</button>
    </div>
    ${!state.dateSet ? `<div class="firstrun"><p><b>Where are you in your game?</b> Set the season and day once, then tap <i>Next day</i> each morning. Everything here follows that date.</p><button class="btn" data-action="date">Set my date</button></div>` : ''}
    <ul class="today-list">${items.join('') || '<li class="muted">A quiet day. Good for farming, fishing or the Mines.</li>'}</ul>
  </section>
  <div class="grid2">
    <section class="panel"><h3>${pix('cal', 14)} This week</h3><ul class="uplist">${upHtml}</ul></section>
    <section class="panel"><h3>${pix('star', 14)} Grab it while it's ${esc(st.season)}</h3><p class="muted small">Seasonal bundle items you haven't ticked off yet.</p>${needHtml}</section>
  </div>
  <section class="panel"><h3>${pix('cal', 14)} ${esc(st.season)}, Year ${st.year}</h3>${calendar(st.season, st.year, st.day, true)}<p class="muted small">Tap a day to jump to it.</p></section>
  <div class="grid2">
    <section class="panel"><h3>${pix('sprout', 14)} Plant today</h3><p class="muted small">What still has time to grow before ${esc(SEASONS[(SEASON_IDX[st.season] + 1) % 4])} 1.</p><ul class="plantlist">${plantHtml || '<li class="muted">Nothing grows outdoors this season. The Greenhouse and garden pots still work.</li>'}</ul></section>
    <section class="panel"><h3>${pix('fish', 16)} Biting ${state.hour == null ? 'today' : 'at ' + fmtHour(state.hour)}${st.rain ? ' (rain)' : ''}</h3><p class="muted small">${state.hour == null ? 'Set a time at the top to narrow this down.' : 'Change the time at the top to see other fish.'}</p>${fishHtml || '<p class="muted">Nothing is biting at this hour.</p>'}</section>
  </div>
  <section class="panel"><h3>${pix('sprout', 14)} Forage in ${esc(st.season)}</h3><div class="chips">${forage}</div></section>`;
}

function calendar(season, year, selDay, settable) {
  const head = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="cal-h">${d}</div>`).join('');
  let cells = '';
  for (let day = 1; day <= 28; day++) {
    const evs = eventsOn(season, day, year).filter(e => !e.spoil || state.spoilers);
    const marks = evs.map(e => e.kind === 'festival' ? `<span class="m fest" title="${esc(e.name)}">${esc(e.name)}</span>` : e.kind === 'birthday' ? `<span class="m bday" title="${esc(e.name)}'s birthday">${esc(e.name)}</span>` : `<span class="m ev" title="${esc(e.name)}">${esc(e.name)}</span>`).join('');
    cells += `<button class="cal-d${day === selDay ? ' sel' : ''}" ${settable ? `data-setday="${day}" data-setseason="${season}"` : 'tabindex="-1"'} aria-label="${season} ${day}${evs.length ? ': ' + esc(evs.map(e => e.name).join(', ')) : ''}"><span class="n">${day}</span>${marks}</button>`;
  }
  return `<div class="cal">${head}${cells}</div>`;
}

/* ---------- Bundles ---------- */
function bundlesView() {
  const st = ctx();
  let total = 0, done = 0;
  for (const r of BUNDLE_ROOMS) for (const b of r.bundles) { total++; if (bundleDone(b)) done++; }
  const rooms = BUNDLE_ROOMS.map(room => {
    const rDone = room.bundles.filter(bundleDone).length;
    const bundles = room.bundles.map(b => {
      const c = bundleCount(b);
      const fin = c >= b.need;
      let items = b.items;
      if (state.bundleNow && !fin) items = items.filter(it => state.checks[it.key] || inSeason(itemByName(it.name), st.season));
      if (state.bundleNow && fin) items = [];
      const rows = items.map(it => itemRow(it, st)).join('');
      return `<div class="bundle${fin ? ' done' : ''}">
        <div class="bundle-h"><h4>${esc(b.n)}</h4><span class="count">${c}/${b.need}${b.need < b.items.length ? ` <span class="muted">(any ${b.need} of ${b.items.length})</span>` : ''}</span></div>
        <div class="bar"><span style="width:${Math.min(100, c / b.need * 100)}%"></span></div>
        ${rows ? `<ul class="items">${rows}</ul>` : state.bundleNow && !fin ? '<p class="muted small">Nothing for this bundle this season.</p>' : ''}
        <p class="reward">Reward: ${esc(b.reward)}</p>
      </div>`;
    }).join('');
    return `<section class="panel room"><div class="room-h"><h3>${esc(room.room)}</h3><span class="pill${rDone === room.bundles.length ? ' good' : ''}">${rDone}/${room.bundles.length}</span></div><p class="muted small">Finish the room: ${esc(room.reward)}.</p><div class="bundles">${bundles}</div></section>`;
  }).join('');
  return `<section class="panel intro">
    <div class="room-h"><h2>Community Center</h2><span class="pill${done === total ? ' good' : ''}">${done} of ${total} bundles</span></div>
    <div class="bar big"><span style="width:${done / total * 100}%"></span></div>
    <label class="toggle"><input type="checkbox" id="bundleNow" ${state.bundleNow ? 'checked' : ''}> Only show what I can get in ${esc(st.season)}</label>
    <p class="muted small">Tick items as you put them in. Items with a season dot are only around in that season.</p>
  </section>${rooms}`;
}
function itemRow(it, st) {
  const e = itemByName(it.name);
  const checked = !!state.checks[it.key];
  const seasonal = e && e.seasons && e.seasons.length < 4;
  const nowOk = inSeason(e, st.season);
  const how = e ? e.src.split(' · ')[0] : (it.note === 'pay in gold' ? 'Pay with gold at the Vault.' : '');
  return `<li class="it${checked ? ' got' : ''}">
    <label class="check"><input type="checkbox" data-check="${it.key}" ${checked ? 'checked' : ''} aria-label="Donated ${esc(it.name)}"><span class="box"></span></label>
    <div class="it-main">
      <div class="it-name">${e ? chip(it.name, { cls: 'link' }) : esc(it.name)}${it.qty > 1 ? ` <span class="qty">×${it.qty}</span>` : ''}${it.note && it.note !== 'pay in gold' && it.note !== 'second stack' ? ` <span class="qual">${esc(it.note)}</span>` : ''}
        ${seasonal ? e.seasons.map(s => `<span class="dot ${seasonCls(s)}" title="${s}"></span>`).join('') : ''}${seasonal && !nowOk && !checked ? '<span class="pill soft">not this season</span>' : ''}</div>
      ${how ? `<div class="it-how">${esc(how)}</div>` : ''}
    </div></li>`;
}

/* ---------- People ---------- */
function peopleView() {
  const st = ctx();
  let list = VILLAGERS.filter(v => showSpoil({ spoil: v.spoil })).map(v => { const [s, d] = v.b.split(' '); return { v, s, d: +d, until: daysUntil(st, s, +d) }; });
  if (state.people === 'marry') list = list.filter(x => x.v.m);
  if (state.people === 'abc') list.sort((a, b) => a.v.n.localeCompare(b.v.n)); else list.sort((a, b) => a.until - b.until);
  const filters = [['soon', 'Next birthday'], ['abc', 'A–Z'], ['marry', 'Marriage candidates']].map(([k, l]) => `<button class="seg${state.people === k ? ' on' : ''}" data-people="${k}">${l}</button>`).join('');
  const rows = list.map(({ v, s, d, until }) => {
    const lv = lovedItems(v).names.slice(0, 4);
    return `<li><button class="person" data-open="villager:${slug(v.n)}">
      <span class="pname">${esc(v.n)}${v.m ? `<span class="heart" title="Marriage candidate">${pix('heart', 12)}</span>` : ''}</span>
      <span class="pbday"><span class="stag ${seasonCls(s)}">${s} ${d}</span><span class="pill${until === 0 ? ' hot' : until <= 3 ? ' warn' : ' soft'}">${until === 0 ? 'Today!' : relDays(until)}</span></span>
      <span class="ploves">Loves ${esc(lv.join(', '))}${lovedItems(v).names.length > 4 ? '…' : ''}</span>
    </button></li>`;
  }).join('');
  return `<section class="panel"><div class="room-h"><h2>Villagers</h2></div><div class="segs">${filters}</div><ul class="people">${rows}</ul></section>`;
}

/* ---------- Field guide ---------- */
function fieldView() {
  const st = ctx();
  const fs = state.fieldSeason || st.season;
  const segs = [['crops', 'Crops'], ['fish', 'Fish'], ['forage', 'Forage'], ['cooking', 'Cooking'], ['minerals', 'Minerals']].map(([k, l]) => `<button class="seg${state.field === k ? ' on' : ''}" data-field="${k}">${l}</button>`).join('');
  const seasonSegs = ['crops', 'fish', 'forage'].includes(state.field) ? `<div class="segs seasons">${SEASONS.map(s => `<button class="seg ${seasonCls(s)}${fs === s ? ' on' : ''}" data-fseason="${s}">${s}${s === st.season ? ' ·' : ''}</button>`).join('')}</div>` : '';
  let body = '';
  if (state.field === 'crops') {
    const rows = CROPS.map(c => IDX.get('crop:' + slug(c[0]))).filter(e => e.crop.seasons ? e.crop.seasons.includes(fs) : true);
    const pl = fs === st.season ? Object.fromEntries(plantable(st).map(p => [p.e.name, p])) : {};
    body = `<div class="tablewrap"><table class="tbl"><thead><tr><th>Crop</th><th class="num">Days</th><th class="num">Regrows</th><th>Seeds</th><th class="num">Sells</th>${fs === st.season ? '<th>Plant by</th>' : ''}</tr></thead><tbody>${rows.map(e => {
      const c = e.crop, p = pl[e.name];
      return `<tr><td>${chip(e.name, { id: e.id, cls: 'link' })}</td><td class="num">${c.days}</td><td class="num">${c.regrow ? c.regrow + 'd' : '—'}</td><td class="small">${c.price ? gold(c.price) + ' · ' : ''}${esc(c.where.split(',')[0])}</td><td class="num">${gold(c.sell)}</td>${fs === st.season ? `<td>${!c.seasons ? '<span class="pill soft">indoors</span>' : p && p.ok ? (p.lastDay >= 28 ? '<span class="pill good">any day</span>' : `<span class="pill${p.lastDay - st.day <= 2 ? ' warn' : ' good'}">${st.season.slice(0, 2)} ${p.lastDay}</span>`) : '<span class="pill soft">too late</span>'}</td>` : ''}</tr>`;
    }).join('')}</tbody></table></div>
    <h4 class="sub-h">Fruit trees</h4><p class="muted small">Saplings from Pierre's. They need 28 days and a clear 3×3 space, then fruit every day in their season.</p><div class="chips">${FRUIT_TREES.map(t => chip(t[0], { label: `${t[0]} · ${SEASON_CODE[t[1]]}` })).join('')}</div>`;
  } else if (state.field === 'fish') {
    let rows = [...IDX.values()].filter(e => e.type === 'fish' && e.fish && !e.fish.crab && showSpoil(e) && inSeason(e, fs));
    const nowSet = fs === st.season && state.fishNowOnly ? new Set(fishNow(st).map(e => e.id)) : null;
    if (nowSet) rows = rows.filter(e => nowSet.has(e.id));
    rows.sort((a, b) => a.name.localeCompare(b.name));
    body = `${fs === st.season ? `<label class="toggle"><input type="checkbox" id="fishNowOnly" ${state.fishNowOnly ? 'checked' : ''}> Only fish biting ${state.hour == null ? 'today' : 'at ' + fmtHour(state.hour)} (${st.rain ? 'rain' : 'sunny'})</label>` : ''}
    <div class="tablewrap"><table class="tbl"><thead><tr><th>Fish</th><th>Where</th><th>Time</th><th>Weather</th><th class="num">Sells</th></tr></thead><tbody>${rows.map(e => `<tr><td>${chip(e.name, { id: e.id, cls: 'link' })}${e.fish.legendary ? ' <span class="pill hot">legendary</span>' : ''}</td><td class="small">${esc(e.fish.where)}</td><td class="small">${fmtTimes(e.fish.times)}</td><td class="small">${e.fish.weather === 'Any' ? 'Any' : e.fish.weather === 'Rain' ? 'Rain' : 'Sun'}</td><td class="num">${gold(e.sell)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No fish match. Try another time or weather.</td></tr>'}</tbody></table></div>
    <h4 class="sub-h">Crab pots (any season)</h4><p class="muted small">Buy or craft a Crab Pot, add bait, and drop it in water. Check it daily.</p><div class="chips">${CRAB_POT.map(c => chip(c[0], { label: `${c[0]} · ${c[2] === 'Ocean' ? 'ocean' : 'fresh'}` })).join('')}</div>`;
  } else if (state.field === 'forage') {
    const list = FORAGE.filter(f => { const s = parseSeasons(f[1]); return (s ? s.includes(fs) : true) && (!f[6] || state.spoilers); });
    body = `<ul class="flist">${list.map(f => `<li>${chip(f[0], { cls: 'link' })}<span class="meta">${esc(f[2])}</span>${f[1] === 'Any' ? '<span class="stag any">all year</span>' : ''}</li>`).join('')}</ul>`;
  } else if (state.field === 'cooking') {
    const list = RECIPES.filter(r => !r[4] || state.spoilers);
    body = `<p class="muted small">You need a kitchen first (Robin's first house upgrade). Ingredients in your fridge count.</p><ul class="flist">${list.map(r => `<li>${chip(r[0], { cls: 'link' })}<span class="meta">${esc(r[1].replace(/;/g, ', '))}</span><span class="src">${esc(r[2])}</span></li>`).join('')}</ul>`;
  } else {
    const groups = ['Gem', 'Foraged Mineral', 'Geode', 'Geode Mineral'];
    body = groups.map(g => `<h4 class="sub-h">${g === 'Geode' ? 'Geodes' : g + 's'}</h4><ul class="flist">${ITEMS.filter(i => i[1] === g).map(i => `<li>${chip(i[0], { cls: 'link' })}<span class="meta">${esc(i[2])}</span></li>`).join('')}</ul>`).join('') + '<p class="muted small">Donate one of each to the Museum before selling.</p>';
  }
  return `<section class="panel"><div class="room-h"><h2>Field guide</h2></div><div class="segs">${segs}</div>${seasonSegs}${body}</section>`;
}

/* ---------- How-to ---------- */
function howtoView() {
  const groups = {};
  for (const g of GUIDES) (groups[g.g] = groups[g.g] || []).push(g);
  const order = ['Getting started', 'Places', 'Friends & family', 'Farming & money', 'Late game'];
  const sections = order.filter(k => groups[k]).map(k => `<section class="panel"><h3>${esc(k)}</h3><ul class="guides">${groups[k].map(g => `<li><button class="guide${g.spoil && !state.spoilers ? ' spoil' : ''}" data-open="guide:${slug(g.n)}"><span>${esc(g.n)}</span>${g.spoil && !state.spoilers ? '<span class="pill soft">spoiler</span>' : ''}</button></li>`).join('')}</ul></section>`).join('');
  return `${sections}
  <section class="panel settings"><h3>Settings</h3>
    <label class="toggle"><input type="checkbox" id="setSpoil" ${state.spoilers ? 'checked' : ''}> Show late-game spoilers (Ginger Island, secret areas, legendary fish)</label>
    <label class="toggle"><input type="checkbox" id="setCC" ${state.ccDone ? 'checked' : ''}> I've finished the Community Center (changes some shop hours)</label>
    <div class="reset" id="resetBox"><button class="btn small ghost" data-action="askreset">Clear all bundle ticks</button></div>
    <p class="muted small" id="syncNote"></p>
  </section>
  <section class="panel credits" id="credits"><h3>About &amp; credits</h3>
    <p class="small"><b>Game facts</b> come from the <a href="https://stardewvalleywiki.com" target="_blank" rel="noopener">Stardew Valley Wiki</a>, written by its community of editors. Gift tastes, bundles, fish, crops, recipes and festival details were checked there for version 1.6, then condensed and reworded for this almanac. Wiki content is shared under <a href="https://creativecommons.org/licenses/by-nc-sa/3.0/" target="_blank" rel="noopener">CC BY-NC-SA 3.0</a>, so this almanac is shared under the same license: free and non-commercial.</p>
    <p class="small"><b>Stardew Valley</b> is made by ConcernedApe (Eric Barone). This is an unofficial fan guide, not affiliated with or endorsed by ConcernedApe.</p>
    <p class="small"><b>Fonts:</b> Pixelify Sans and Nunito, from Google Fonts, under the SIL Open Font License.</p>
  </section>`;
}
function creditLine() {
  return `<footer class="credit-line">Unofficial fan guide · Facts from the <a href="https://stardewvalleywiki.com" target="_blank" rel="noopener">Stardew Valley Wiki</a> (<a href="https://creativecommons.org/licenses/by-nc-sa/3.0/" target="_blank" rel="noopener">CC BY-NC-SA</a>) · <button class="linkbtn" data-action="credits">Credits</button></footer>`;

/* ---------- Detail sheet ---------- */
const stack = [];
function openDetail(id, push = true) {
  const e = IDX.get(id); if (!e) return;
  if (push) stack.push(id);
  const sheet = $('#sheet');
  sheet.hidden = false;
  document.body.classList.add('sheet-open');
  $('#sheetBack').hidden = stack.length < 2;
  $('#sheetBody').innerHTML = detailHtml(e);
  $('#sheetBody').scrollTop = 0;
  sheet.querySelector('.sheet-card').focus({ preventScroll: true });
}
function closeDetail() { stack.length = 0; $('#sheet').hidden = true; document.body.classList.remove('sheet-open'); }
function backDetail() { stack.pop(); if (stack.length) openDetail(stack[stack.length - 1], false); else closeDetail(); }

function giftBlock(name) {
  const w = whoLikes(name);
  const vis = n => showSpoil(VILLAGERS.find(v => v.n === n));
  const row = (label, list, cls) => {
    const l = list.filter(vis); if (!l.length) return '';
    const chips = `<span class="chips">${l.map(n => chip(n, { id: 'villager:' + slug(n) })).join('')}</span>`;
    if (l.length > 10) return `<details class="giftrow ${cls}"><summary><span class="glabel">${label}</span> <span class="small">${l.length} villagers${l.length >= 25 ? ' (almost everyone)' : ''}</span></summary>${chips}</details>`;
    return `<div class="giftrow ${cls}"><span class="glabel">${label}</span>${chips}</div>`;
  };
  const html = row('Loved by', w.love, 'love') + row('Liked by', w.like, 'like') + row('Don\'t give to', [...w.hate, ...w.dis], 'bad');
  return html ? `<h4>As a gift</h4>${html}` : '';
}
function bundleBlock(name) {
  const uses = bundleUses(name);
  if (!uses.length) return '';
  const st = ctx();
  const need = uses.filter(it => !state.checks[it.key] && !bundleDone(it.bundle));
  return `<div class="callout${need.length ? ' keep' : ''}">${need.length ? `<b>Keep one!</b> Still needed for the Community Center.` : 'Used in the Community Center (already donated).'}<ul class="items">${uses.map(it => itemRow(it, st).replace('<li class="it', `<li data-bundle="${esc(it.bundle.n)}" class="it`)).map((h, i) => h.replace('<div class="it-name">', `<div class="it-name"><span class="bname">${esc(uses[i].bundle.n)} Bundle:</span> `)).join('')}</ul></div>`;
}
function detailHtml(e) {
  const st = ctx();
  if (e.spoil && !state.spoilers) {
    return `<div class="d-head"><div class="eyebrow">${TYPE_LABEL[e.type]}</div><h2>${esc(e.name)}</h2></div><div class="callout">This is late-game content. <button class="btn small" data-action="reveal">Show it anyway</button></div>`;
  }
  const head = (label, extra = '') => `<div class="d-head"><div class="eyebrow">${label}</div><h2>${esc(e.name)}</h2>${extra}</div>`;
  if (e.type === 'villager') {
    const v = e.v; const [s, d] = v.b.split(' '); const until = daysUntil(st, s, +d);
    const lv = lovedItems(v), lk = lovedItems(v, 'like');
    const uni = UNIVERSAL.love.split(';').filter(n => giftTaste(v, n) === 'love');
    const avoid = [...tasteTable(v).hate.names, ...tasteTable(v).dis.names];
    const avoidCats = [...tasteTable(v).hate.cats, ...tasteTable(v).dis.cats].map(r => r.raw);
    return head(v.m ? 'Villager · marriage candidate' : 'Villager') + `
      <div class="facts"><div><span>Birthday</span><b>${esc(v.b)}</b> <span class="pill${until === 0 ? ' hot' : until <= 3 ? ' warn' : ' soft'}">${until === 0 ? 'Today!' : relDays(until)}</span></div><div><span>Lives</span><b>${esc(v.home)}</b></div></div>
      <p>${esc(v.who)}</p>
      <h4>${pix('heart', 12)} Loves</h4><div class="chips">${lv.names.map(n => chip(n, { mark: 1, cls: 'love' })).join('')}${lv.cats.map(c => `<span class="chip plain love">${esc(c)}</span>`).join('')}</div>
      ${uni.length ? `<p class="muted small">Also loves the universal favorites: ${uni.map(n => esc(n)).join(', ')}.</p>` : ''}
      <h4>Likes</h4><div class="chips">${lk.names.map(n => chip(n, { mark: 1 })).join('')}${lk.cats.map(c => `<span class="chip plain">${esc(c)}</span>`).join('')}${!lk.names.length && !lk.cats.length ? '<span class="muted">Nothing special.</span>' : ''}</div>
      ${avoid.length || avoidCats.length ? `<h4>Don't give</h4><div class="chips">${avoid.map(n => chip(n, { cls: 'bad' })).join('')}${avoidCats.map(c => `<span class="chip plain bad">${esc(c)}</span>`).join('')}</div>` : ''}
      <p class="muted small">You can give 2 gifts a week, plus one on their birthday (worth 8×). Items with a dot are in season now.</p>`;
  }
  if (e.type === 'person') return head('Character') + `<p>${esc(e.who)}</p>`;
  if (e.type === 'festival') {
    const f = e.f; const until = Math.min(...f.d.map(d => daysUntil(st, f.s, d)));
    return head('Festival', `<div class="facts"><div><span>When</span><b>${esc(f.s)} ${f.d.join(', ')}</b> <span class="pill${until === 0 ? ' hot' : ' soft'}">${until === 0 ? 'Today!' : relDays(until)}</span></div><div><span>Where</span><b>${esc(f.where)}</b></div><div><span>Time</span><b>${esc(f.time)}</b></div></div>`) +
      `<p>${esc(f.what)}</p><div class="callout">${esc(f.tip)}</div>`;
  }
  if (e.type === 'shop') {
    const s = e.shop; const r = shopStatus(s, st);
    return head('Shop', `<div class="facts"><div><span>Hours</span><b>${esc(s.hours)}</b></div><div><span>Closed</span><b>${esc(s.closed)}</b></div><div><span>${esc(dateLabel(st.season, st.day))}${state.hour != null ? ', ' + fmtHour(state.hour) : ''}</span><b class="${r.closed ? 'bad' : 'good'}">${r.closed ? esc(r.why) : 'Open · ' + esc(r.why)}</b></div></div>`) +
      `<p><b>Where:</b> ${esc(s.where)}</p><p><b>Sells:</b> ${esc(s.sells)}</p><p class="muted small">Run by ${chip(s.who.split(' ')[0], { id: idFor(s.who.split(' ')[0]) || undefined })}</p>`;
  }
  if (e.type === 'guide') {
    const g = e.g;
    return head('How-to · ' + g.g) + `<ol class="steps">${g.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${g.tip ? `<div class="callout">${esc(g.tip)}</div>` : ''}`;
  }
  if (e.type === 'bundle') {
    const b = e.b;
    return head('Bundle · ' + b.room, `<div class="facts"><div><span>Progress</span><b>${bundleCount(b)}/${b.need}</b></div><div><span>Reward</span><b>${esc(b.reward)}</b></div></div>`) + `<ul class="items">${b.items.map(it => itemRow(it, st)).join('')}</ul>`;
  }
  // item-like
  const label = TYPE_LABEL[e.type] + (e.catLabel && e.type === 'item' ? ' · ' + e.catLabel : '');
  let facts = '';
  if (e.sell) facts += `<div><span>Sells for</span><b>${gold(e.sell)}</b></div>`;
  if (e.type !== 'dish') facts += `<div><span>Season</span><b>${e.seasons ? e.seasons.join(', ') : 'Any season'}</b>${e.seasons && !e.seasons.includes(st.season) ? ' <span class="pill soft">not now</span>' : e.seasons ? ' <span class="pill good">in season</span>' : ''}</div>`;
  let body = '';
  if (e.type === 'crop') {
    const c = e.crop;
    facts += `<div><span>Grows in</span><b>${c.days} days${c.regrow ? `, then every ${c.regrow}` : ''}</b></div>`;
    body += `<p><b>Seeds:</b> ${esc(c.seed)}${c.price ? ' · ' + gold(c.price) : ''} · ${esc(c.where)}</p>`;
    if (c.seasons && c.seasons.includes(st.season)) {
      const p = plantable(st).find(p => p.e === e);
      body += p.ok ? `<div class="callout good">Plant today and it's ready on ${p.ready <= 28 ? st.season + ' ' + p.ready : 'day ' + (p.ready - 28) + ' of next season'}${p.harvests > 1 ? `, with about ${p.harvests} harvests before it dies` : ''}. ${p.lastDay >= 28 ? '' : `Last day to plant: <b>${st.season} ${p.lastDay}</b>.`}</div>`
        : `<div class="callout warn">Too late to plant ${esc(e.name)} this ${st.season}: it needs ${c.days} days and only ${p.left} are left.</div>`;
    } else if (c.seasons) body += `<div class="callout">Grows in ${c.seasons.join(' and ')} only. Out of season it won't grow outdoors; the Greenhouse works year-round.</div>`;
    if (GIANT_CROPS.includes(e.name)) body += `<div class="callout"><b>Can grow giant.</b> Nine of these in a 3×3 square sometimes merge into one huge crop overnight. Chop it with your axe for 15–21 ${esc(e.name)}. ${chip('What causes giant crops?', { id: 'guide:giant-crops', cls: 'link' })}</div>`;
    if (c.notes) body += `<p>${esc(c.notes)}</p>`;
    if (e.src.includes(' · ')) body += `<p><b>Also:</b> ${esc(e.src.split(' · ').slice(1).join(' '))}</p>`;
  } else if (e.type === 'fish' && e.fish && !e.fish.crab) {
    const f = e.fish;
    const now = fishNow(st).includes(e);
    facts += `<div><span>Time</span><b>${fmtTimes(f.times)}</b></div><div><span>Weather</span><b>${f.weather === 'Any' ? 'Any' : f.weather === 'Rain' ? 'Rainy days' : 'Sunny days'}</b></div><div><span>Difficulty</span><b>${f.diff}</b> <span class="diff"><span style="width:${Math.min(100, f.diff)}%"></span></span></div>`;
    body += `<p><b>Where:</b> ${esc(f.where)}${f.where.split(',').map(x => FISH_SPOTS[x.trim()]).filter(Boolean).length ? `<br><span class="muted small">${f.where.split(',').map(x => FISH_SPOTS[x.trim()]).filter(Boolean).map(esc).join(' · ')}</span>` : ''}</p>`;
    if (f.gi) body += `<p class="muted small">Also bites all year on Ginger Island.</p>`;
    body += now ? `<div class="callout good">Biting ${state.hour == null ? 'today' : 'at ' + fmtHour(state.hour)}${st.rain ? ' in the rain' : ''}.</div>` : `<div class="callout">Not biting right now (${st.season}, ${st.rain ? 'rain' : 'sunny'}${state.hour != null ? ', ' + fmtHour(state.hour) : ''}).</div>`;
    if (f.note) body += `<p>${esc(f.note)}</p>`;
  } else if (e.type === 'dish') {
    body += `<h4>Ingredients</h4><div class="chips">${e.dish.ing.map(x => { const m = x.match(/^(.*?)(×\d+)?$/); return chip(m[1], { label: x.replace('×', ' ×'), mark: 1 }); }).join('')}</div><p><b>Recipe:</b> ${esc(e.dish.source)}</p>`;
  } else {
    body += `<p><b>How to get it:</b> ${esc(e.src)}</p>`;
  }
  const rec = recipeUses(e.name);
  return head(label, `<div class="facts">${facts}</div>`) + bundleBlock(e.name) + body +
    giftBlock(e.name) + (rec.length ? `<h4>Cook with it</h4><div class="chips">${rec.map(r => chip(r)).join('')}</div>` : '');
}

/* ---------- Search results ---------- */
let lastQuery = '';
function strong(r) { return r.results.length && r.results[0].score >= 6; }
function specialAnswer(q, r) {
  const w = norm(q).split(' ');
  const st = ctx();
  const has = (...k) => k.some(x => w.includes(x));
  if (has('birthday', 'birthdays', 'bday') && !(strong(r) && r.results[0].e.type === 'villager')) {
    const list = VILLAGERS.filter(v => showSpoil({ spoil: v.spoil })).map(v => { const [s, d] = v.b.split(' '); return { v, s, d: +d, u: daysUntil(st, s, +d) }; }).sort((a, b) => a.u - b.u).slice(0, 5);
    return `<div class="answer"><div class="eyebrow">Upcoming birthdays</div><ul class="uplist">${list.map(x => `<li><span class="when">${x.s} ${x.d}</span><span>${chip(x.v.n, { id: 'villager:' + slug(x.v.n), cls: 'link' })} <span class="muted">${relDays(x.u)}</span></span></li>`).join('')}</ul></div>`;
  }
  if (has('festival', 'festivals', 'event', 'events') && !strong(r)) {
    const list = FESTIVALS.map(f => ({ f, u: Math.min(...f.d.map(d => daysUntil(st, f.s, d))) })).sort((a, b) => a.u - b.u).slice(0, 4);
    return `<div class="answer"><div class="eyebrow">Next festivals</div><ul class="uplist">${list.map(x => `<li><span class="when">${x.f.s} ${x.f.d[0]}</span><span>${chip(x.f.n, { id: 'festival:' + slug(x.f.n), cls: 'link' })} <span class="muted">${relDays(x.u)}</span></span></li>`).join('')}</ul></div>`;
  }
  if (has('fish', 'fishing', 'biting') && (has('now', 'today', 'rain', 'rainy', 'biting', 'can', 'season', 'tonight', 'night') || w.length <= 2) && !strong(r)) {
    const list = fishNow(st).filter(showSpoil).filter(e => !e.fish.legendary);
    return `<div class="answer"><div class="eyebrow">Biting ${state.hour == null ? 'today' : 'at ' + fmtHour(state.hour)} · ${st.season}, ${st.rain ? 'rain' : 'sunny'}</div><div class="chips">${list.map(e => chip(e.name, { id: e.id })).join('')}</div><p class="muted small">Change the weather or time at the top to see other fish.</p></div>`;
  }
  if (has('plant', 'grow', 'seed', 'seeds', 'crop', 'crops') && !strong(r)) {
    const ok = plantable(st).filter(p => p.ok && p.e.crop.seasons.length < 4);
    return `<div class="answer"><div class="eyebrow">Still time to plant · ${st.season} ${st.day}</div><div class="chips">${ok.map(p => chip(p.e.name, { id: p.e.id, label: p.e.name + ' · ' + p.e.crop.days + 'd' })).join('') || '<span class="muted">Nothing outdoors this season.</span>'}</div></div>`;
  }
  if (has('open', 'closed', 'shop', 'shops', 'store', 'stores') && !strong(r)) {
    return `<div class="answer"><div class="eyebrow">Shops · ${WEEKDAYS[dow(st.day)]} ${st.season} ${st.day}${state.hour != null ? ', ' + fmtHour(state.hour) : ''}</div><ul class="shoplist">${SHOPS.map(s => { const x = shopStatus(s, st); return `<li>${chip(s.n, { id: 'shop:' + slug(s.n), cls: 'link' })}<span class="${x.closed ? 'bad' : 'good'} small">${esc(x.closed ? x.why : 'Open · ' + x.why)}</span></li>`; }).join('')}</ul></div>`;
  }
  return '';
}
function answerCard(e, intents) {
  const st = ctx();
  if (!showSpoil(e)) return `<div class="answer"><div class="eyebrow">${TYPE_LABEL[e.type]} · spoiler</div><h3>${esc(e.name)}</h3><button class="btn small" data-open="${e.id}">Show it anyway</button></div>`;
  let body = '';
  if (e.type === 'villager') {
    const v = e.v; const [s, d] = v.b.split(' '); const u = daysUntil(st, s, +d);
    const bd = `<p class="big">Birthday <b>${esc(v.b)}</b> · ${u === 0 ? '<b>today!</b>' : relDays(u)}</p>`;
    const loves = `<div class="chips">${lovedItems(v).names.map(n => chip(n, { mark: 1, cls: 'love' })).join('')}</div>`;
    body = intents.has('bday') ? bd + `<p class="small muted">Loves:</p>` + loves : `<p class="small muted">Loves:</p>${loves}${bd}`;
  } else if (e.type === 'shop') {
    const r = shopStatus(e.shop, st);
    body = `<p class="big"><b class="${r.closed ? 'bad' : 'good'}">${r.closed ? esc(r.why) : 'Open · ' + esc(r.why)}</b></p><p class="small">${esc(e.shop.hours)} · Closed ${esc(e.shop.closed.toLowerCase())}</p>`;
  } else if (e.type === 'festival') {
    const f = e.f; const u = Math.min(...f.d.map(d => daysUntil(st, f.s, d)));
    body = `<p class="big"><b>${esc(f.s)} ${f.d.join(', ')}</b> · ${relDays(u)}</p><p class="small">${esc(f.where)}, ${esc(f.time)}. ${esc(f.what)}</p>`;
  } else if (e.type === 'guide') {
    body = `<ol class="steps small">${e.g.steps.slice(0, 3).map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
  } else if (e.type === 'bundle') {
    body = `<p class="small">${bundleCount(e.b)}/${e.b.need} done · ${e.b.items.map(i => esc(i.name)).join(', ')}</p>`;
  } else if (e.type === 'person') {
    body = `<p class="small">${esc(e.who)}</p>`;
  } else {
    const uses = bundleUses(e.name).filter(it => !state.checks[it.key] && !bundleDone(it.bundle));
    const w = whoLikes(e.name);
    body = `<p class="small">${esc(e.type === 'fish' && e.fish && !e.fish.crab ? e.src : e.type === 'crop' ? e.src : e.src.split(' · ')[0])}</p>`
      + (e.seasons ? `<p class="small">${seasonTags(e.seasons)}</p>` : '')
      + (uses.length ? `<p class="small keepnote"><b>Keep one:</b> needed for the ${uses.map(u => esc(u.bundle.n)).join(' and ')} bundle.</p>` : '')
      + (w.love.length ? `<p class="small">Loved by ${w.love.filter(n => showSpoil(VILLAGERS.find(v => v.n === n))).map(n => chip(n, { id: 'villager:' + slug(n) })).join(' ')}</p>` : '');
  }
  return `<div class="answer"><div class="eyebrow">${TYPE_LABEL[e.type]}</div><h3>${esc(e.name)}</h3>${body}<button class="btn small" data-open="${e.id}">Open full page ›</button></div>`;
}
function renderResults() {
  const q = $('#q').value.trim();
  lastQuery = q;
  const box = $('#results');
  if (!q) { box.hidden = true; $('#view').hidden = false; return; }
  box.hidden = false; $('#view').hidden = true;
  const r = search(q, 12);
  const special = specialAnswer(q, r);
  let html = special;
  const res = r.results;
  if (res.length) {
    let top = res[0].e;
    if (r.intents.has('hours') && top.type === 'villager') { const sh = SHOPS.find(x => x.who.startsWith(top.name)); if (sh) top = IDX.get('shop:' + slug(sh.n)); }
    if (!special) html += answerCard(top, r.intents);
    const rest = special ? res : res.slice(1);
    if (rest.length) html += `<h4 class="sub-h">${special ? 'Matches' : 'Other matches'}</h4><ul class="results">${rest.map(x => `<li><button class="result${showSpoil(x.e) ? '' : ' spoil'}" data-open="${x.e.id}"><span class="rtype">${TYPE_LABEL[x.e.type]}</span><span class="rname">${showSpoil(x.e) ? esc(x.e.name) : 'Spoiler: ' + esc(x.e.name)}</span><span class="rsnip">${esc(snippet(x.e))}</span></button></li>`).join('')}</ul>`;
  } else if (!special) {
    const sg = suggest(q);
    html += `<div class="answer"><div class="eyebrow">No match</div><p>Nothing called “${esc(q)}”. Try a shorter word or describe it, like “purple mushroom” or “guy in the sewer”.</p>${sg.length ? `<p class="small">Did you mean: ${sg.map(e => chip(e.name, { id: e.id })).join(' ')}</p>` : ''}</div>`;
  }
  html += askBox(q);
  box.innerHTML = html;
}
function snippet(e) {
  if (e.type === 'villager') return `Birthday ${e.v.b}`;
  if (e.type === 'shop') return e.shop.hours;
  if (e.type === 'festival') return `${e.f.s} ${e.f.d.join(', ')}`;
  if (e.type === 'guide') return e.g.g;
  if (e.type === 'bundle') return e.b.room;
  if (e.type === 'person') return e.who.slice(0, 60);
  return (e.src || '').split(' · ')[0].slice(0, 80);
}

/* ---------- Ask Claude (when the viewer allows it) ---------- */
let sampleFn = null, askCtl = null;
function askBox(q) {
  if (!sampleFn) return '';
  return `<div class="askbox"><button class="btn" data-action="ask">Ask Claude: “${esc(q.length > 60 ? q.slice(0, 57) + '…' : q)}”</button><div id="askOut" class="askout" hidden></div></div>`;
}
function factsFor(e) {
  if (e.type === 'villager') { const v = e.v; return `${v.n} (villager): birthday ${v.b}; lives ${v.home}; ${v.who} Loves: ${v.love.replace(/;/g, ', ')}. Likes: ${v.like.replace(/;/g, ', ')}. Hates: ${v.hate.replace(/;/g, ', ') || 'nothing special'}.`; }
  if (e.type === 'shop') return `${e.name} (shop): ${e.shop.hours}; closed ${e.shop.closed}; ${e.shop.where}; sells ${e.shop.sells}`;
  if (e.type === 'festival') return `${e.name} (festival): ${e.f.s} ${e.f.d.join(', ')}, ${e.f.where}, ${e.f.time}. ${e.f.what} ${e.f.tip}`;
  if (e.type === 'guide') return `How-to "${e.name}": ${e.g.steps.join(' ')} ${e.g.tip || ''}`;
  if (e.type === 'bundle') return `${e.name} (${e.b.room}): needs ${e.b.need} of ${e.b.items.map(i => i.name + (i.qty > 1 ? ' x' + i.qty : '')).join(', ')}; reward ${e.b.reward}.`;
  const w = whoLikes(e.name);
  return `${e.name} (${TYPE_LABEL[e.type]}): ${e.src || ''} Seasons: ${e.seasons ? e.seasons.join('/') : 'any'}. Sells ${e.sell || '?'}g. Loved by: ${w.love.join(', ') || 'nobody in particular'}. Bundles: ${bundleUses(e.name).map(u => u.bundle.n).join(', ') || 'none'}.`;
}
async function ask() {
  const out = $('#askOut'); if (!out || !sampleFn) return;
  const q = lastQuery;
  out.hidden = false; out.textContent = 'Thinking…';
  if (askCtl) askCtl.abort();
  askCtl = new AbortController();
  const st = ctx();
  const hits = search(q, 8).results.map(x => '- ' + factsFor(x.e)).join('\n');
  const missing = [];
  for (const room of BUNDLE_ROOMS) for (const b of room.bundles) if (!bundleDone(b)) missing.push(`${b.n} (${bundleCount(b)}/${b.need})`);
  const prompt = `You are the friendly helper inside a pocket almanac for Stardew Valley 1.6. A player is mid-game and asked a quick question.

Player's game: ${st.season} ${st.day}, Year ${st.year} (${WEEKDAYS[dow(st.day)]}), weather ${st.rain ? 'rain' : 'sunny'}${state.hour != null ? ', about ' + fmtHour(state.hour) : ''}. Community Center ${st.ccDone ? 'finished' : 'in progress; unfinished bundles: ' + missing.slice(0, 12).join(', ')}. ${state.spoilers ? '' : 'Avoid late-game spoilers (Ginger Island, Qi, secret areas) unless the question is about them.'}

Facts from the almanac that may help (trust these over memory):
${hits || '- (no direct matches)'}

Question: ${q}

Answer in 1 to 4 short, plain sentences, like a friend who knows the game well. Be specific about names, places, days and times. If the player probably misremembered a name, say what they likely mean. No headings or lists unless they asked for a list.`;
  try {
    const res = await sampleFn(prompt, { signal: askCtl.signal, onText: ({ text }) => { out.textContent = text; } });
    out.textContent = res.text;
  } catch (err) {
    out.textContent = err && err.code === 'rate_limited' ? 'Claude is busy right now. Try again in a minute.' : err && err.code === 'cancelled' ? '' : 'Claude couldn\'t answer that right now.';
    if (err && err.code === 'not_granted') { sampleFn = null; renderResults(); }
  }
}
async function initSample() {
  if (!window.claude || !window.claude.use) return;
  try { const s = await claude.use('sample'); if (s) { sampleFn = s; if (lastQuery) renderResults(); } } catch (e) { /* unavailable */ }
}

/* ---------- Date picker ---------- */
let pk = null;
function openPicker() {
  pk = { season: state.season, year: state.year };
  renderPicker();
  $('#datePop').hidden = false;
  $('#datePop .pop-card').focus({ preventScroll: true });
}
function renderPicker() {
  $('#popBody').innerHTML = `<div class="segs seasons">${SEASONS.map(s => `<button class="seg ${seasonCls(s)}${pk.season === s ? ' on' : ''}" data-pseason="${s}">${s}</button>`).join('')}</div>
    <div class="yearrow"><button class="btn small ghost" data-action="pyear" data-d="-1" aria-label="Previous year">‹</button><b>Year ${pk.year}</b><button class="btn small ghost" data-action="pyear" data-d="1" aria-label="Next year">›</button></div>
    ${calendar(pk.season, pk.year, pk.season === state.season && pk.year === state.year ? state.day : 0, true)}
    <p class="muted small">Pick the day you're on in your game.</p>`;
}

/* ---------- Main render ---------- */
function render() {
  renderHeader();
  const v = $('#view');
  v.innerHTML = state.tab === 'bundles' ? bundlesView() : state.tab === 'people' ? peopleView() : state.tab === 'field' ? fieldView() : state.tab === 'howto' ? howtoView() : todayView();
  v.insertAdjacentHTML('beforeend', creditLine());
  if (state.tab === 'howto') syncNote();
  if (lastQuery) renderResults();
  if (!$('#sheet').hidden && stack.length) $('#sheetBody').innerHTML = detailHtml(IDX.get(stack[stack.length - 1]));
}

/* ---------- Events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-open],[data-action],[data-tab],[data-setday],[data-people],[data-field],[data-fseason],[data-pseason]');
  if (!t) return;
  if (t.dataset.open) { openDetail(t.dataset.open); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; $('#q').value = ''; renderResults(); save(true); render(); window.scrollTo({ top: 0 }); return; }
  if (t.dataset.setday) {
    state.day = +t.dataset.setday; state.season = t.dataset.setseason; state.dateSet = 1;
    if (!$('#datePop').hidden) { state.year = pk.year; $('#datePop').hidden = true; }
    save(); render(); return;
  }
  if (t.dataset.people) { state.people = t.dataset.people; save(true); render(); return; }
  if (t.dataset.field) { state.field = t.dataset.field; save(true); render(); return; }
  if (t.dataset.fseason) { state.fieldSeason = t.dataset.fseason === state.season ? null : t.dataset.fseason; render(); return; }
  if (t.dataset.pseason) { pk.season = t.dataset.pseason; renderPicker(); return; }
  const a = t.dataset.action;
  if (a === 'nextday') shiftDay(1);
  else if (a === 'prevday') shiftDay(-1);
  else if (a === 'date') openPicker();
  else if (a === 'closepop') $('#datePop').hidden = true;
  else if (a === 'pyear') { pk.year = Math.max(1, pk.year + +t.dataset.d); renderPicker(); }
  else if (a === 'weather') { state.rain = !state.rain; save(); render(); }
  else if (a === 'close') closeDetail();
  else if (a === 'back') backDetail();
  else if (a === 'clear') { $('#q').value = ''; renderResults(); $('#q').focus(); }
  else if (a === 'ask') ask();
  else if (a === 'reveal') { state.spoilers = true; save(); render(); }
  else if (a === 'askreset') $('#resetBox').innerHTML = `<span class="small">Clear every tick?</span> <button class="btn small danger" data-action="doreset">Yes, clear</button> <button class="btn small ghost" data-action="noreset">Keep them</button>`;
  else if (a === 'doreset') { state.checks = {}; save(); render(); }
  else if (a === 'noreset') render();
  else if (a === 'credits') { state.tab = 'howto'; $('#q').value = ''; renderResults(); render(); const c = $('#credits'); if (c) c.scrollIntoView({ block: 'start' }); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.check) { if (t.checked) state.checks[t.dataset.check] = 1; else delete state.checks[t.dataset.check]; save(); render(); return; }
  if (t.id === 'bundleNow') { state.bundleNow = t.checked; save(true); render(); }
  if (t.id === 'fishNowOnly') { state.fishNowOnly = t.checked; save(true); render(); }
  if (t.id === 'setSpoil') { state.spoilers = t.checked; save(); render(); }
  if (t.id === 'setCC') { state.ccDone = t.checked; save(); render(); }
  if (t.id === 'hourSel') { state.hour = t.value === '' ? null : +t.value; save(); render(); }
});
let qTimer = 0;
document.addEventListener('input', ev => { if (ev.target.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(renderResults, 80); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (!$('#datePop').hidden) $('#datePop').hidden = true;
    else if (!$('#sheet').hidden) closeDetail();
    else if ($('#q').value) { $('#q').value = ''; renderResults(); }
  }
  if (ev.key === '/' && document.activeElement !== $('#q') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { ev.preventDefault(); $('#q').focus(); }
  if (ev.key === 'Enter' && ev.target.id === 'q') { const first = $('#results [data-open]'); if (first && !$('#results .answer [data-open]')) first.click(); else { const o = $('#results .answer .btn[data-open]'); if (o) o.click(); } }
});
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeDetail(); });
$('#datePop').addEventListener('click', ev => { if (ev.target.id === 'datePop') $('#datePop').hidden = true; });

// hour options
$('#hourSel').innerHTML = '<option value="">Any time</option>' + Array.from({ length: 20 }, (_, i) => i + 6).map(h => `<option value="${h}">${fmtHour(h)}</option>`).join('');
document.querySelectorAll('[data-icon]').forEach(el => { el.insertAdjacentHTML('afterbegin', pix(el.dataset.icon, +(el.dataset.size || 18))); });

render();
initCloud();
initSample();

</script>
</body></html>
